<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="discGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
  </defs>

  <!-- Dark Obsidian Disc Backing -->
  <circle cx="16" cy="16" r="15" fill="url(#discGrad)" stroke="#F59E0B" stroke-width="1.2" />

  <!-- Crown Base Band -->
  <rect x="7" y="21" width="18" height="4" rx="1.5" fill="url(#goldGrad)" stroke="#78350F" stroke-width="0.5" />
  
  <!-- Crown Spikes -->
  <polygon points="7,21 7,12 11,16 16,7 21,16 25,12 25,21" fill="url(#goldGrad)" stroke="#78350F" stroke-width="0.5" />

  <!-- Jewels on Spikes -->
  <circle cx="7" cy="11.5" r="1.5" fill="#EF4444" stroke="#7F1D1D" stroke-width="0.3" />
  <circle cx="16" cy="6.5" r="1.8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="0.4" />
  <circle cx="25" cy="11.5" r="1.5" fill="#EF4444" stroke="#7F1D1D" stroke-width="0.3" />

  <!-- Base Jewels -->
  <circle cx="11" cy="23" r="1" fill="#38BDF8" />
  <circle cx="16" cy="23" r="1.2" fill="#EF4444" />
  <circle cx="21" cy="23" r="1" fill="#38BDF8" />

  <!-- GUG Sparkle -->
  <polygon points="26,6 27,8 29,9 27,10 26,12 25,10 23,9 25,8" fill="#FDE047" opacity="0.9" />
</svg>
