<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="coinGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Dark Rim with Drop Shadow -->
  <circle cx="16" cy="16" r="15" fill="#451A03" filter="url(#glow)" />
  
  <!-- Outer Gold Bevel Rim -->
  <circle cx="16" cy="16" r="14" fill="url(#rimGrad)" />
  
  <!-- Inner Coin Groove -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#78350F" stroke-width="0.75" />
  
  <!-- Coin Face -->
  <circle cx="16" cy="16" r="11" fill="url(#coinGrad)" />

  <!-- Embossed GUG 'G' Centerpiece -->
  <!-- Subtle Highlight on Top -->
  <path d="M 19.5 11.5 C 18.5 10.5 17 10 15.5 10 C 12.2 10 9.8 12.5 9.8 16 C 9.8 19.5 12.2 22 15.5 22 C 18.5 22 20.2 20.2 20.5 17.5 L 15.5 17.5 L 15.5 15.5 L 22.5 15.5 L 22.5 18 C 22.1 21.2 19.5 23.8 15.5 23.8 C 11.2 23.8 7.8 20.3 7.8 16 C 7.8 11.7 11.2 8.2 15.5 8.2 C 17.8 8.2 19.8 9 21.2 10.5 Z" fill="#451A03" />
  <path d="M 19 12 C 18 11 16.8 10.5 15.5 10.5 C 12.6 10.5 10.5 12.8 10.5 16 C 10.5 19.2 12.6 21.5 15.5 21.5 C 18 21.5 19.6 20 20 17.8 L 15.5 17.8 L 15.5 16 L 21.8 16 L 21.8 17.8 C 21.5 20.8 19 23 15.5 23 C 11.8 23 8.8 19.8 8.8 16 C 8.8 12.2 11.8 9 15.5 9 C 17.4 9 19 9.8 20.2 11.2 Z" fill="#FDE047" />

  <!-- Gleam Highlight Spark -->
